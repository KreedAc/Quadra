<!doctype html><meta charset="utf-8">
<style>
  html,body{margin:0;padding:0}
  body{
    width:1024px;height:500px;display:flex;align-items:center;justify-content:center;gap:56px;
    padding:0 72px;box-sizing:border-box;background:#0D141C;
    font-family:Roboto,"Segoe UI",-apple-system,sans-serif;color:#E8EEF5;
    position:relative;overflow:hidden;
  }
  /* Un alone del gradiente identitario dietro l'icona: dà profondità senza
     aggiungere un elemento in più da leggere. */
  .alone{
    position:absolute;left:-90px;top:50%;transform:translateY(-50%);
    width:520px;height:520px;border-radius:50%;
    background:radial-gradient(circle,rgba(47,107,255,.30) 0%,rgba(31,216,164,.12) 45%,transparent 70%);
  }
  .icona{
    width:212px;height:212px;border-radius:52px;flex:none;position:relative;
    background:linear-gradient(135deg,#2F6BFF,#1FD8A4);
    box-shadow:0 26px 60px rgba(47,107,255,.42);
  }
  .icona svg{position:absolute;inset:0}
  .testo{position:relative}
  h1{font-size:82px;font-weight:700;letter-spacing:-3px;margin:0}
  .claim{font-size:34px;color:#B9C6D4;margin:14px 0 30px;letter-spacing:-.5px}
  .punti{display:flex;gap:12px}
  .punti span{
    font-size:20px;color:#9FB0C0;border:1.5px solid #24313F;
    border-radius:999px;padding:9px 20px;
  }
</style>
<div class="alone"></div>
<div class="icona">
  <svg width="212" height="212" viewBox="18 18 72 72" xmlns="http://www.w3.org/2000/svg">
    <path d="M65.5,40.5a17,17 0 1,0 0,27" fill="none" stroke="#FFF" stroke-width="6.5" stroke-linecap="round"/>
    <path d="M38,49.5h22M38,58.5h22" fill="none" stroke="#FFF" stroke-width="6" stroke-linecap="round"/>
  </svg>
</div>
<div class="testo">
  <h1>Quadra</h1>
  <div class="claim">Le tue spese, e basta.</div>
  <div class="punti">
    <span>Niente account</span><span>Niente server</span><span>Nessun permesso</span>
  </div>
</div>
